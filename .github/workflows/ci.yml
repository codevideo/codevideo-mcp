name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          # The render worker kills process groups on Unix and process trees on
          # Windows; run its tests on both.
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      # The packaging checks drive npm through spawnSync, which can't run npm.cmd
      # on Windows; the package is the same on every OS, so Unix runs suffice.
      - if: runner.os != 'Windows'
        run: npm run verify-package
      - if: runner.os != 'Windows'
        run: npm run smoke:packed
